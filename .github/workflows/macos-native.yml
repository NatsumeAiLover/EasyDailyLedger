name: Build native macOS ledger

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version Release to receive the Mac files
        required: true
        default: v1.3
        type: string
      publish:
        description: Update Mac assets in that existing Release (otherwise build artifacts only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: native-macos-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check target version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos-native/Resources/Info.plist)
          if [[ "$RELEASE_TAG" != "v$VERSION" && "$RELEASE_TAG" != "v${VERSION%.0}" ]]; then
            echo 'The Release tag must match the application version.'
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then gh release view "$RELEASE_TAG"; fi
          swift --version
      - name: Test native ledger core
        working-directory: macos-native
        run: swift test --parallel
      - name: Build and sign native application
        working-directory: macos-native
        run: bash scripts/build-macos.sh
      - name: Package matching native source
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos-native/Resources/Info.plist)
          mkdir -p native-source/.github/workflows
          cp .github/workflows/macos-native.yml native-source/.github/workflows/
          rsync -a --exclude=.build --exclude=.swiftpm --exclude=release macos-native native-source/
          ditto -c -k --sequesterRsrc --keepParent native-source "macos-native/release/DailyLedger-$VERSION-native-source.zip"
          cd macos-native/release
          shasum -a 256 "DailyLedger-$VERSION-native-source.zip" >> SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DailyLedger-native-macOS27-arm64
          path: |
            macos-native/release/*.zip
            macos-native/release/SHA256SUMS.txt
            macos-native/release/linked-frameworks.txt
          if-no-files-found: error
      - name: Update Mac files in the existing version Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node macos-native/scripts/publish-release.mjs
